name: Build Android Bundle
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup and Build
        run: |
          # 1. Aik temporary 'www' folder banayein
          mkdir -p www
          
          # 2. Apni files ko 'www' folder mein copy karein
          cp index.html www/ 2>/dev/null || true
          cp style.css www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          
          # 3. Project initialize karein
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 4. Capacitor ko 'www' folder ka rasta dikhayein
          npx cap init "Al Mumin Guide" com.gsons.mumin --web-dir www
          npx cap add android || true
          npx cap sync android
          
          # 5. Final Android Build
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload .aab Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Mumin-Guide-Bundle
          path: "**/*.aab"
